<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626" />
      <stop offset="50%" stop-color="#182e50" />
      <stop offset="100%" stop-color="#12213a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b4d1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9448bc" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90fcf9" />
      <stop offset="100%" stop-color="#63b4d1" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7699d4" />
      <stop offset="100%" stop-color="#63b4d1" />
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9448bc" />
      <stop offset="100%" stop-color="#480355" />
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90fcf9" />
      <stop offset="100%" stop-color="#9448bc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines / Tech Pattern -->
  <g opacity="0.12" stroke="#63b4d1" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="660" y1="0" x2="660" y2="675"/>
    <line x1="840" y1="0" x2="840" y2="675"/>
    <line x1="1020" y1="0" x2="1020" y2="675"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="260" r="300" fill="#63b4d1" opacity="0.1" filter="blur(60px)"/>
  <circle cx="600" cy="290" r="200" fill="#9448bc" opacity="0.15" filter="blur(50px)"/>

  <!-- 6 Computer Science Graduates Figures -->
  <!-- Person 1 -->
  <g transform="translate(130, 200)">
    <circle cx="50" cy="40" r="34" fill="url(#g1)"/>
    <path d="M 5 150 C 5 95, 95 95, 95 150 Z" fill="url(#g2)" opacity="0.9"/>
  </g>

  <!-- Person 2 -->
  <g transform="translate(290, 175)">
    <circle cx="55" cy="45" r="38" fill="url(#g4)"/>
    <path d="M 5 165 C 5 105, 105 105, 105 165 Z" fill="url(#g3)" opacity="0.9"/>
  </g>

  <!-- Person 3 -->
  <g transform="translate(470, 160)">
    <circle cx="60" cy="48" r="42" fill="url(#g1)"/>
    <path d="M 5 180 C 5 110, 115 110, 115 180 Z" fill="url(#g2)" opacity="0.95"/>
  </g>

  <!-- Person 4 -->
  <g transform="translate(630, 160)">
    <circle cx="60" cy="48" r="42" fill="url(#g4)"/>
    <path d="M 5 180 C 5 110, 115 110, 115 180 Z" fill="url(#g3)" opacity="0.95"/>
  </g>

  <!-- Person 5 -->
  <g transform="translate(810, 175)">
    <circle cx="55" cy="45" r="38" fill="url(#g1)"/>
    <path d="M 5 165 C 5 105, 105 105, 105 165 Z" fill="url(#g2)" opacity="0.9"/>
  </g>

  <!-- Person 6 -->
  <g transform="translate(970, 200)">
    <circle cx="50" cy="40" r="34" fill="url(#g4)"/>
    <path d="M 5 150 C 5 95, 95 95, 95 150 Z" fill="url(#g3)" opacity="0.9"/>
  </g>

  <!-- Card Overlay / Frame -->
  <rect x="150" y="450" width="900" height="155" rx="20" fill="url(#cardGrad)" stroke="#63b4d1" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Text -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    6 Computer Science Graduates
  </text>
  <text x="600" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#90fcf9" text-anchor="middle" letter-spacing="0.5">
    Inspired by womENcourage 2026 • Nice, France
  </text>
  <text x="600" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#63b4d1" text-anchor="middle" opacity="0.9">
    Building software tools for workplace equality and healthy boundary defense
  </text>
</svg>
