<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12213a" />
      <stop offset="50%" stop-color="#182e50" />
      <stop offset="100%" stop-color="#0c1626" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63b4d1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9448bc" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="avatarGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90fcf9" />
      <stop offset="100%" stop-color="#63b4d1" />
    </linearGradient>
    <linearGradient id="avatarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9448bc" />
      <stop offset="100%" stop-color="#480355" />
    </linearGradient>
    <linearGradient id="avatarGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7699d4" />
      <stop offset="100%" stop-color="#63b4d1" />
    </linearGradient>
    <linearGradient id="avatarGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90fcf9" />
      <stop offset="100%" stop-color="#9448bc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines / Pattern -->
  <g opacity="0.15" stroke="#63b4d1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="300" r="280" fill="#63b4d1" opacity="0.12" filter="blur(60px)"/>
  <circle cx="600" cy="320" r="180" fill="#9448bc" opacity="0.15" filter="blur(50px)"/>

  <!-- Stylized Team Figures -->
  <!-- Person 1 (Left) -->
  <g transform="translate(240, 210)">
    <circle cx="60" cy="45" r="42" fill="url(#avatarGrad1)" opacity="0.9"/>
    <path d="M 0 170 C 0 110, 120 110, 120 170 Z" fill="url(#avatarGrad3)" opacity="0.85"/>
  </g>

  <!-- Person 2 (Center-Left) -->
  <g transform="translate(420, 175)">
    <circle cx="70" cy="50" r="48" fill="url(#avatarGrad4)" opacity="0.95"/>
    <path d="M 0 200 C 0 130, 140 130, 140 200 Z" fill="url(#avatarGrad2)" opacity="0.9"/>
  </g>

  <!-- Person 3 (Center-Right) -->
  <g transform="translate(640, 175)">
    <circle cx="70" cy="50" r="48" fill="url(#avatarGrad1)" opacity="0.95"/>
    <path d="M 0 200 C 0 130, 140 130, 140 200 Z" fill="url(#avatarGrad3)" opacity="0.9"/>
  </g>

  <!-- Person 4 (Right) -->
  <g transform="translate(840, 210)">
    <circle cx="60" cy="45" r="42" fill="url(#avatarGrad2)" opacity="0.9"/>
    <path d="M 0 170 C 0 110, 120 110, 120 170 Z" fill="url(#avatarGrad4)" opacity="0.85"/>
  </g>

  <!-- Card Overlay / Frame -->
  <rect x="180" y="440" width="840" height="150" rx="20" fill="url(#cardGrad)" stroke="#63b4d1" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Text -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    kNOw MORE Team
  </text>
  <text x="600" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#90fcf9" text-anchor="middle" letter-spacing="0.5">
    Empowering women with strategic boundary clarity &amp; career agency
  </text>
  <text x="600" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#63b4d1" text-anchor="middle" opacity="0.8">
    [ Sample Group Photo Placeholder • To be replaced with photo ]
  </text>
</svg>
